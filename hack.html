<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybersecurity Simulation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;

    background-image:url('skull.jpeg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.warning{
    color:#ff0000;
    font-size:90px;
    font-weight:900;
    text-transform:uppercase;

    text-shadow:
        0 0 10px #ff0000,
        0 0 20px #ff0000,
        0 0 40px #ff0000,
        0 0 80px #ff0000;

    animation:blink 1s infinite;
}

.subtext{
    color:white;
    font-size:28px;
    margin-top:20px;
    letter-spacing:2px;
}

.note{
    color:#00ff00;
    margin-top:30px;
    font-size:18px;
}

@keyframes blink{
    0%,100%{
        opacity:1;
    }
    50%{
        opacity:0.4;
    }
}
</style>
</head>

<body>

<div class="overlay">
    <div class="warning">
        SIMULATED<br>CYBER ATTACK
    </div>

    <div class="subtext">
        SECURITY TRAINING DEMONSTRATION
    </div>

    <div class="note">
        This is a simulation and not a real compromise.
    </div>
</div>

<script>
window.onload = function() {
    alert("SIMULATED CYBER ATTACK DEMO");
};
</script>

</body>
</html>
