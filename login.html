<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPRCAS Login Portal</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            background:#0f172a;
        }

        @property --angle{
            syntax:"<angle>";
            initial-value:0deg;
            inherits:false;
        }

        .container{
            position:relative;
            width:420px;
            padding:40px;
            border-radius:25px;
            background:repeating-conic-gradient(
                from var(--angle),
                #00e5ff 0%,
                #00e5ff 10%,
                transparent 10%,
                transparent 40%,
                #00e5ff 50%
            );
            animation:spin 4s linear infinite;
        }

        .container::before{
            content:'';
            position:absolute;
            inset:0;
            border-radius:25px;
            background:repeating-conic-gradient(
                from var(--angle),
                #ff2770 0%,
                #ff2770 10%,
                transparent 10%,
                transparent 40%,
                #ff2770 50%
            );
            animation:spin 4s linear infinite;
            animation-delay:-2s;
        }

        .container::after{
            content:'';
            position:absolute;
            inset:5px;
            background:#111827;
            border-radius:20px;
        }

        @keyframes spin{
            from{--angle:0deg;}
            to{--angle:360deg;}
        }

        .login-box{
            position:relative;
            z-index:10;
            text-align:center;
            color:white;
        }

        .logo{
            width:110px;
            height:110px;
            object-fit:contain;
            background:white;
            border-radius:50%;
            padding:8px;
            margin-bottom:15px;
            box-shadow:
                0 0 10px #00e5ff,
                0 0 25px #00e5ff,
                0 0 50px #00e5ff;
        }

        h1{
            font-size:24px;
            margin-bottom:5px;
            color:#00e5ff;
        }

        .subtitle{
            font-size:13px;
            color:#ccc;
            margin-bottom:25px;
        }

        .input-box{
            position:relative;
            margin:15px 0;
        }

        .input-box i{
            position:absolute;
            left:18px;
            top:50%;
            transform:translateY(-50%);
            color:#00e5ff;
        }

        .input-box input{
            width:100%;
            padding:14px 14px 14px 50px;
            border:none;
            outline:none;
            border-radius:30px;
            background:rgba(255,255,255,0.08);
            color:white;
            font-size:15px;
        }

        .input-box input::placeholder{
            color:#aaa;
        }

        .login-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:30px;
            background:#00e5ff;
            color:black;
            font-weight:600;
            cursor:pointer;
            margin-top:15px;
            transition:.3s;
        }

        .login-btn:hover{
            box-shadow:
                0 0 15px #00e5ff,
                0 0 40px #00e5ff;
        }

        .links{
            display:flex;
            justify-content:space-between;
            margin-top:18px;
        }

        .links a{
            text-decoration:none;
            color:white;
            font-size:13px;
        }

        .links a:last-child{
            color:#ff2770;
            font-weight:600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="login-box">

            <img src="kprcas-logo.png" alt="KPRCAS Logo" class="logo">

            <h1>KPRCAS</h1>
            <p class="subtitle">Student Login Portal</p>

            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" placeholder="Register Number">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Password">
            </div>

            <button class="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Login
            </button>

            <div class="links">
                <a href="#">Forgot Password?</a>
                <a href="#">Sign Up</a>
            </div>

        </div>
    </div>

</body>
</html>
